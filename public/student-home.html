<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Classes - ClassQ&A</title>
    <link rel="stylesheet" href="style.css">
    <script src="theme.js"></script>
</head>

<body>
    <nav class="navbar">
        <div class="nav-logo">📘 ClassQ&A - Student</div>
        <div class="nav-links">
            <a href="student-home.html">My Classes</a>
            <a href="#" style="color: #3498db; font-weight: bold;">+ Join Class</a>
            <a href="#" onclick="logout()">Log Out</a>
            <button id="theme-toggle" class="theme-btn"
                style="background:none; border:none; color:inherit; cursor:pointer; display:flex; align-items:center;"></button>
        </div>
    </nav>

    <div class="layout-container">
        <header style="display: flex; justify-content: space-between; align-items: flex-end;">
            <div>
                <h1>My Classes</h1>
                <p class="subtitle" id="welcome-message">Loading user...</p>
            </div>
            <button class="submit-btn" style="width: auto; padding: 10px 20px;" onclick="showJoinModal()">+ Join Class</button>
        </header>

        <div class="class-grid" id="class-grid">
        </div>
    </div>

    <!-- Join Class Modal -->
    <div id="join-class-modal"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center;">
        <div style="background:white; padding:20px; border-radius:8px; width:300px; color:black;">
            <h3>Join a Class</h3>
            <input type="text" id="join-code-input" placeholder="Enter 6-digit Join Code"
                style="width:100%; padding:8px; margin:10px 0;">
            <button onclick="handleJoinClass()"
                style="width:100%; padding:8px; background:#3498db; color:white; border:none;">Join</button>
            <button onclick="document.getElementById('join-class-modal').style.display='none'"
                style="width:100%; padding:8px; margin-top:5px;">Cancel</button>
        </div>
    </div>

    <script>
        function showJoinModal() { document.getElementById('join-class-modal').style.display = 'flex'; }
    </script>

    <script src="student-home.js"></script>
</body>

</html>
