<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Classes - ClassQ&A</title>
    <link rel="stylesheet" href="style.css">
    <script src="theme.js"></script>
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="nav-logo-link">Class<span>Q&A</span></a>
        <div class="nav-links">
            <button id="theme-toggle" class="theme-btn"></button>
            <div class="nav-divider"></div>
            <button onclick="logout()" class="nav-logout-btn">Log Out</button>
        </div>
    </nav>

    <div class="layout-container">
        <header style="display: flex; justify-content: space-between; align-items: flex-end;">
            <div>
                <h1>Student Dashboard</h1>
                <p class="subtitle" id="welcome-message">Loading user...</p>
            </div>
            <button class="submit-btn" style="width: auto; padding: 10px 20px;" onclick="showJoinModal()">+ Join
                Class</button>
        </header>

        <div class="class-grid" id="class-grid">
        </div>
    </div>

    <div id="join-class-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>Join a Class</h3>
            <p style="color: var(--muted-text);">Enter the 6-character code provided by your instructor.</p>

            <!-- WRAP IN A FORM AND USE onsubmit -->
            <form onsubmit="event.preventDefault(); handleJoinClass();">
                <input style="color: var(--muted-text)" type="text" id="join-code-input" placeholder="e.g., A1B2C3" style="text-transform: uppercase;"
                    required>
                <button type="submit" class="btn-primary">Join Class</button>
                <button type="button" onclick="hideJoinModal()" class="btn-secondary">Cancel</button>
            </form>

        </div>
    </div>


    <script src="student-home.js"></script>
</body>



</html>
