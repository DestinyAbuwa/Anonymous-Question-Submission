<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructor Dashboard - ClassQ&A</title>
    <link rel="stylesheet" href="style.css">
    <script src="theme.js"></script>
</head>

<body>
    <nav class="navbar">
        <!-- Links back to index.html -->
        <a href="index.html" class="nav-logo-link">Class<span>Q&A</span></a>

        <div class="nav-links">

            <button id="theme-toggle" class="theme-btn"></button>
            <div class="nav-divider"></div>
            <button onclick="logout()" class="nav-logout-btn">Log Out</button>
        </div>
    </nav>

    <div class="layout-container">
        <!-- Upgraded Header to match Student Dashboard -->
        <header style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px;">
            <div>
                <h1 style="margin-bottom: 5px;">Instructor Dashboard</h1>
                <p class="subtitle" id="welcome-message">Loading user...</p>
            </div>
            <!-- Moved the button here! -->
            <button class="submit-btn" style="width: auto; padding: 10px 20px;" onclick="showCreateModal()">+ Create
                Class</button>
        </header>

        <div class="class-grid" id="class-grid">
            <!-- Dynamic classes load here -->
        </div>
    </div>

    <!-- Create Class Modal -->
    <div id="create-class-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>Create New Class</h3>
            <p style="color: var(--muted-text)">Generate a unique code for your students to join.</p>

            <!-- WRAP IN A FORM AND USE onsubmit -->
            <form onsubmit="event.preventDefault(); handleCreateClass();">
                <input type="text" id="class-name-input" placeholder="e.g., CS 101: Intro to Programming" required>
                <button type="submit" class="btn-primary">Create Class</button>
                <button type="button" onclick="hideCreateModal()" class="btn-secondary">Cancel</button>
            </form>

        </div>
    </div>

    <!-- Generic Confirm Modal -->
    <div id="confirm-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3 style="margin-top:0;">Confirm Action</h3>
            <p id="confirm-message">Are you sure?</p>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="hideConfirmModal()"
                    style="color: var(--text-color); flex: 1; padding: 10px; background: var(--bg-color); border: 1px solid var(--border-color); cursor: pointer;">Cancel</button>
                <button id="confirm-yes-btn"
                    style="flex: 1; padding: 10px; background: #e74c3c; color: white; border: none; cursor: pointer;">Yes,
                    Delete</button>
            </div>
        </div>
    </div>

    <script src="instructor-home.js"></script>
</body>

</html>
