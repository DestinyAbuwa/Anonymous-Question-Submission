<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructor Dashboard - ClassQ&A</title>
    <link rel="stylesheet" href="style.css">
    <script src="theme.js"></script>
</head>

<body>
    <header class="navbar">
        <div class="nav-logo">📘 ClassQ&A - Instructor</div>
        <div class="nav-links">
            <a href="instructor-home.html">My Classes</a>
            <!-- This will eventually trigger a popup to generate a code! -->
            <a href="#" style="color: #27ae60; font-weight: bold;" onclick="showCreateModal()">+ Create Class</a>
            <a href="#" onclick="logout()">Log Out</a>
            <button id="theme-toggle" class="theme-btn"
                style="background:none; border:none; color:inherit; cursor:pointer; display:flex; align-items:center;"></button>
        </div>
    </header>

    <div class="layout-container">
        <section class="panel">
            <h2 id="welcome-message" style="margin-bottom: 5px;">Instructor Dashboard</h2>
            <p class="subtitle">Manage your classes and active Q&A sessions.</p>

            <div id="class-grid" class="class-grid"
                style="margin-top: 25px; display: grid; gap: 15px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));">
                <!-- Hardcoded test class for now -->
                <div class="class-card" onclick="window.location.href='instructor.html'">
                    <div class="class-card-header"
                        style="height: 80px; background: linear-gradient(135deg, #27ae60, #2ecc71); border-radius: 8px 8px 0 0;">
                    </div>
                    <div class="class-card-body" style="padding: 15px;">
                        <h3>CS 101: Intro to Programming</h3>
                        <p>Manage Live Session</p>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- Create Class Modal -->
    <div id="create-class-modal"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center;">
        <div style="background:white; padding:20px; border-radius:8px; width:300px; color:black;">
            <h3>Create New Class</h3>
            <input type="text" id="class-name-input" placeholder="Class Name (e.g. CS 101)"
                style="width:100%; padding:8px; margin:10px 0;">
            <button onclick="handleCreateClass()"
                style="width:100%; padding:8px; background:#27ae60; color:white; border:none; cursor:pointer;">Create</button>
            <button onclick="hideCreateModal()"
                style="width:100%; padding:8px; margin-top:5px; background:#ccc; border:none; cursor:pointer;">Cancel</button>
        </div>
    </div>
    <script src="instructor-home.js"></script>
</body>

</html>
