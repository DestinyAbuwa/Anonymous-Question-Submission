<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ClassQ&A</title>
    <link rel="stylesheet" href="style.css">
    <script src="theme.js"></script>
</head>
<body>
    <div class="layout-container" style="max-width: 500px;">
        <section class="panel" style="text-align: center;">
            <h2>Welcome Back</h2>
            <p class="subtitle">Log in to access your class dashboard.</p>
            
            <form id="login-form" style="text-align: left; margin-top: 20px;">
                <div style="margin-bottom: 15px;">
                    <label style="font-weight: bold; display: block; margin-bottom: 5px;">Email</label>
                    <input type="email" id="login-email" required style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 5px;">
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="font-weight: bold; display: block; margin-bottom: 5px;">Password</label>
                    <input type="password" id="login-password" required style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 5px;">
                </div>
                
                <button type="submit" class="submit-btn">Log In</button>
            </form>
            
            <div id="login-status" style="margin-top: 15px; font-weight: bold;"></div>
            
            <p style="margin-top: 20px; font-size: 0.9em;">Don't have an account? <a href="register.html" style="color: #3498db;">Register here</a>.</p>
        </section>
    </div>

    <script src="login.js"></script>
</body>
</html>
