<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Session - ClassQ&A</title>
    <link rel="stylesheet" href="style.css">
    <script src="theme.js"></script>
</head>

<body>
    <nav class="navbar">
        <!-- Links back to index.html -->
        <a href="index.html" class="nav-logo-link">📘 ClassQ&A</a>

        <div class="nav-links">
            <!-- Add your specific links here (e.g., My Classes) -->
            <a href="instructor-home.html">My Dashboard</a>

            <button id="theme-toggle" class="theme-btn"
                style="background:none; border:none; color:inherit; cursor:pointer; display:flex; align-items:center;"></button>
            <div class="nav-divider"></div>
            <button onclick="logout()" class="nav-logout-btn">Log Out</button>
        </div>
    </nav>

    <div class="layout-container">
        <!-- Dynamic Header -->
        <header style="margin-bottom: 20px;">
            <h1 id="class-title">Loading Class...</h1>
            <p class="subtitle" id="class-join-code">Join Code: ---</p>
        </header>

        <!-- Session Management Panel -->
        <section class="panel"
            style="margin-bottom: 25px; padding: 0; overflow: hidden; border: 1px solid var(--border-color);">
            <div
                style="background: var(--navbar-bg); color: var(--navbar-text); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center;">
                <h2 style="margin: 0; font-size: 1.2em;">🎙️ Session Management</h2>
            </div>

            <div style="padding: 25px;">
                <!-- Active Session Controls -->
                <div id="active-session-panel"
                    style="display: none; background: rgba(39, 174, 96, 0.1); border: 1px solid #27ae60; padding: 20px; border-radius: 12px; margin-bottom: 15px; text-align: center;">
                    <div
                        style="display: inline-flex; align-items: center; gap: 10px; background: #27ae60; color: white; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 0.9em; margin-bottom: 15px;">
                        <span
                            style="display: inline-block; width: 10px; height: 10px; background: white; border-radius: 50%; animation: pulse 1.5s infinite;"></span>
                        LIVE NOW
                    </div>
                    <h3 style="margin: 0 0 15px 0; font-size: 1.5em; color: var(--heading-color);"
                        id="current-session-name">---</h3>
                    <button onclick="endSession()" class="nav-logout-btn"
                        style="padding: 12px 30px; font-size: 1.1em; border-radius: 30px; box-shadow: 0 4px 6px rgba(231, 76, 60, 0.3);">End
                        Live Session</button>
                </div>

                <!-- Start / Schedule Session Controls -->
                <div id="start-session-panel" style="display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-end;">
                    <div style="flex: 2; min-width: 250px;">
                        <label style="font-weight: bold; font-size: 0.9rem; color: var(--muted-text);">Session Topic
                            (e.g., Week 2: Arrays)</label>
                        <input type="text" id="session-name-input" placeholder="What are you teaching today?"
                            style="background: var(--bg-color); border: 2px solid var(--border-color); margin-bottom: 0;">
                    </div>
                    <div style="flex: 1; min-width: 180px;">
                        <label style="font-weight: bold; font-size: 0.9rem; color: var(--muted-text);">Schedule Start
                            (Optional)</label>
                        <input type="datetime-local" id="session-time-input"
                            style="background: var(--bg-color); border: 2px solid var(--border-color); margin-bottom: 0;">
                    </div>
                    <div style="display: flex; gap: 10px; padding-bottom: 2px;">
                        <button onclick="startSession()" class="submit-btn"
                            style="width: auto; padding: 15px 25px; margin: 0; background: #2ecc71;">Start Live</button>
                        <button onclick="scheduleSession()" class="submit-btn"
                            style="width: auto; padding: 15px 25px; margin: 0; background: var(--border-color); color: var(--text-color);">Schedule</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Q&A Feed -->
        <section class="panel questions-section">
            <h2>Student Questions</h2>
            <div id="questions-container">
                <p class="subtitle">Start a session to see questions...</p>
            </div>
        </section>
    </div>

    <script src="instructor.js"></script>
</body>

</html>
