<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Q&A Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="theme.js"></script>
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="nav-logo-link">Class<span>Q&A</span></a>
        <div class="nav-links">
            <a href="student-home.html">My Dashboard</a>
            <button id="theme-toggle" class="theme-btn"></button>
            <div class="nav-divider"></div>
            <button onclick="logout()" class="nav-logout-btn">Log Out</button>
        </div>
    </nav>

    <div class="layout-container">
        <header>
            <h1 id="class-title">Loading Class...</h1>
            <p id="session-info">Waiting for instructor to start a session...</p>
        </header>

        <div class="two-column-grid">

            <section class="submit-section panel">
                <h2>Ask a Question</h2>
                <p class="subtitle">Submit anonymously to the instructor.</p>
                <form id="question-form">
                    <textarea id="question-text" rows="4" placeholder="What's on your mind?..." required></textarea>
                    <div id="char-count" style="text-align: right; font-size: 0.8rem; color: var(--muted-text); margin-top: -10px; margin-bottom: 15px; font-weight: 600;">0 / 250</div>
                    <div class="tags-container">
                        <label>Select Tags (Optional):</label>
                        <div id="tag-buttons" class="tag-buttons">
                            <button type="button" class="tag-toggle" data-value="Urgent">Urgent</button>
                            <button type="button" class="tag-toggle" data-value="Clarification">Clarification</button>
                            <button type="button" class="tag-toggle" data-value="Exam-Related">Exam-Related</button>
                        </div>
                    </div>
                    <button type="submit" id="submit-question-btn" class="submit-btn">Submit Question</button>
                </form>
                <div id="status-message"></div>
            </section>

            <section class="live-feed-section panel">
                <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 15px;">
                    <div>
                        <h2 style="margin-bottom: 0;">Live Class Feed</h2>
                        <div id="live-count-badge"
                            style="display: none; align-items: center; gap: 5px; background: #e0f2fe; color: #1e40af; padding: 4px 10px; border-radius: 20px; font-size: 0.85em; font-weight: bold; width: fit-content; margin-top: 10px;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                                <circle cx="9" cy="7" r="4" />
                                <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
                                <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                            </svg>
                            <span id="participant-count">1</span> Online
                        </div>
                        <p class="subtitle" style="margin-bottom: 0; margin-top: 5px;">Upvote questions you want
                            answered.</p>
                    </div>
                    <select id="feed-sort-toggle"
                        style="width: auto; padding: 8px 12px; margin: 0; border-radius: 8px; cursor: pointer; font-weight: bold;">
                        <option value="upvotes">Top Voted</option>
                        <option value="recent">Most Recent</option>
                    </select>
                </div>
                <div id="student-feed-container" class="scrollable-feed">
                    <p>Loading class feed...</p>
                </div>
            </section>

        </div>
    </div>

    <script src="student.js"></script>
</body>

</html>
