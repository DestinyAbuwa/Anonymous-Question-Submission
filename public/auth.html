<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication - ClassQ&A</title>
    <link rel="stylesheet" href="style.css">
    <script src="theme.js"></script>
    <style>
        .auth-tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
        }

        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            font-weight: bold;
            color: var(--muted-text);
            transition: 0.2s;
        }

        .auth-tab.active {
            color: #3498db;
            border-bottom: 3px solid #3498db;
            margin-bottom: -2px;
        }

        .hidden-form {
            display: none;
        }

        .google-btn {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            background-color: var(--panel-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.2s;
        }

        .google-btn:hover {
            background-color: var(--bg-color);
        }
    </style>
</head>

<body>
    <div class="layout-container" style="max-width: 450px; margin-top: 5vh;">
        <section class="panel">
            <div style="text-align: center; margin-bottom: 20px;">
                <h1 style="color: #3498db; font-size: 2.2em; margin-bottom: 5px;">📘 ClassQ&A</h1>
            </div>

            <div class="auth-tabs">
                <div class="auth-tab active" id="tab-login">Log In</div>
                <div class="auth-tab" id="tab-register">Sign Up</div>
            </div>

            <!-- Login Form -->
            <form id="form-login">
                <h2 style="margin-bottom: 5px;">Welcome Back</h2>
                <p class="subtitle">Enter your credentials to access your dashboard.</p>

                <button type="button" class="google-btn" onclick="alert('Google OAuth integration coming soon!')">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="18px" height="18px">
                        <path fill="#FFC107"
                            d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z" />
                        <path fill="#FF3D00"
                            d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z" />
                        <path fill="#4CAF50"
                            d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z" />
                        <path fill="#1976D2"
                            d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z" />
                    </svg>
                    Sign in with Google
                </button>

                <div style="display: flex; align-items: center; margin: 20px 0;">
                    <hr style="flex: 1; border: none; border-top: 1px solid var(--border-color);">
                    <span style="padding: 0 10px; color: var(--muted-text); font-size: 0.9em;">or</span>
                    <hr style="flex: 1; border: none; border-top: 1px solid var(--border-color);">
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="font-weight: bold; display: block; margin-bottom: 5px;">Email</label>
                    <input type="email" id="login-email" required>
                </div>
                <div style="margin-bottom: 20px;">
                    <div
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                        <label style="font-weight: bold; margin: 0;">Password</label>
                        <a href="#" style="font-size: 0.85em; color: #3498db; text-decoration: none;">Forgot
                            Password?</a>
                    </div>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit" class="submit-btn">Log In</button>
            </form>

            <!-- Register Form -->
            <form id="form-register" class="hidden-form">
                <h2 style="margin-bottom: 5px;">Create an Account</h2>
                <p class="subtitle">Join your class to start asking questions.</p>

                <button type="button" class="google-btn" onclick="alert('Google OAuth integration coming soon!')">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="18px" height="18px">
                        <path fill="#FFC107"
                            d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z" />
                        <path fill="#FF3D00"
                            d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z" />
                        <path fill="#4CAF50"
                            d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z" />
                        <path fill="#1976D2"
                            d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z" />
                    </svg>
                    Sign up with Google
                </button>

                <div style="display: flex; align-items: center; margin: 20px 0;">
                    <hr style="flex: 1; border: none; border-top: 1px solid var(--border-color);">
                    <span style="padding: 0 10px; color: var(--muted-text); font-size: 0.9em;">or</span>
                    <hr style="flex: 1; border: none; border-top: 1px solid var(--border-color);">
                </div>

                <div style="margin-bottom: 15px; margin-top: 20px;">
                    <label style="font-weight: bold; display: block; margin-bottom: 5px;">Email</label>
                    <input type="email" id="reg-email" required>
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="font-weight: bold; display: block; margin-bottom: 5px;">Password</label>
                    <input type="password" id="reg-password" required>
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="font-weight: bold; display: block; margin-bottom: 10px;">I am a...</label>
                    <div class="role-selector">
                        <button type="button" class="role-btn active" data-role="Student">👨‍🎓 Student</button>
                        <button type="button" class="role-btn" data-role="Instructor">👨‍🏫 Instructor</button>
                    </div>
                </div>
                <button type="submit" class="submit-btn" style="background-color: #27ae60;">Create Account</button>
            </form>

            <div id="auth-status" style="margin-top: 15px; font-weight: bold; text-align: center;"></div>
        </section>
    </div>
    <script src="auth.js"></script>
</body>

</html>
