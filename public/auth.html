<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication - ClassQ&A</title>
    <link rel="stylesheet" href="style.css">
    <script src="theme.js"></script>
    <style>
        /* A little custom CSS just for the toggle tabs */
        .auth-tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
        }

        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            font-weight: bold;
            color: var(--muted-text);
            transition: 0.2s;
        }

        .auth-tab.active {
            color: #3498db;
            border-bottom: 3px solid #3498db;
            margin-bottom: -2px;
        }

        .hidden-form {
            display: none;
        }
    </style>
</head>

<body>
    <div class="layout-container" style="max-width: 450px;">
        <section class="panel">

            <div class="auth-tabs">
                <div class="auth-tab active" id="tab-login">Log In</div>
                <div class="auth-tab" id="tab-register">Sign Up</div>
            </div>

            <form id="form-login">
                <h2 style="margin-bottom: 5px;">Welcome Back</h2>
                <p class="subtitle">Enter your credentials to access your dashboard.</p>

                <div style="margin-bottom: 15px; margin-top: 20px;">
                    <label style="font-weight: bold; display: block; margin-bottom: 5px;">Email</label>
                    <input type="email" id="login-email" required
                        style="width: 100%; padding: 10px; border-radius: 5px;">
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="font-weight: bold; display: block; margin-bottom: 5px;">Password</label>
                    <input type="password" id="login-password" required
                        style="width: 100%; padding: 10px; border-radius: 5px;">
                </div>
                <button type="submit" class="submit-btn">Log In</button>
            </form>

            <form id="form-register" class="hidden-form">
                <h2 style="margin-bottom: 5px;">Create an Account</h2>
                <p class="subtitle">Join your class to start asking questions.</p>

                <div style="margin-bottom: 15px; margin-top: 20px;">
                    <label style="font-weight: bold; display: block; margin-bottom: 5px;">Email</label>
                    <input type="email" id="reg-email" required style="width: 100%; padding: 10px; border-radius: 5px;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="font-weight: bold; display: block; margin-bottom: 5px;">Password</label>
                    <input type="password" id="reg-password" required
                        style="width: 100%; padding: 10px; border-radius: 5px;">
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="font-weight: bold; display: block; margin-bottom: 10px;">I am a...</label>
                    <div class="role-selector">
                        <button type="button" class="role-btn active" data-role="Student">👨‍🎓 Student</button>
                        <button type="button" class="role-btn" data-role="Instructor">👨‍🏫 Instructor</button>
                    </div>
                </div>
                <button type="submit" class="submit-btn" style="background-color: #27ae60;">Create Account</button>
            </form>

            <div id="auth-status" style="margin-top: 15px; font-weight: bold; text-align: center;"></div>
        </section>
    </div>

    <script src="auth.js"></script>
</body>

</html>
